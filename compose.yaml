services:
  app:
    build:
      context: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      WEBHOOK_ALLOWED_PRIVATE_HOSTS: webhook-receiver
      PORT: ${PORT:-8080}
      GIN_MODE: ${GIN_MODE:-debug}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webhook_engine}
      POSTGRES_USER: ${POSTGRES_USER:-webhook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 5
  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database"
      - "${DATABASE_URL}&x-multi-statement=true"
      - "up"
    restart: "no"
  webhook-receiver:
    image: python:3.13-alpine
    command: ["python", "-u", "/app/server.py"]
    volumes:
      - ./tools/webhook-receiver/server.py:/app/server.py:ro
    environment:
      RECEIVER_MODE: random
      RECEIVER_FAILURE_PERCENT: "50"
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

volumes:
  postgres_data:
